services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://shiptrack:shiptrack@db:5432/shiptrack
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiptrack
      POSTGRES_USER: shiptrack
      POSTGRES_PASSWORD: shiptrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrack -d shiptrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
